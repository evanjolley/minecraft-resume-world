# Cloudflare Workers with static assets.
#
# The platform argument is in docs/DEPLOYMENT.md and is not repeated here. What
# matters when reading this file: nothing below is a static-hosting choice.
# Workers won because multiplayer wants a Durable Object, a Durable Object can
# only live on a Worker, and serving the site from the same Worker means
# multiplayer is a binding added to this file rather than a second platform.
#
# Nothing is deployed yet. `npm run deploy:dry-run` validates this file without
# an account; `npm run deploy` is Evan's to run.

name = "world"

# AI Evan's brain. This is the line that turns a static-asset deploy into a
# real Worker, and it exists for exactly one reason: the Anthropic key. See
# the header of worker/index.js.
#
# worker/index.js imports worker/prompt.generated.js, which is GITIGNORED and
# built from corpus/ by `npm run prompt`. That is why `prompt` is the first
# step of both `deploy` and `deploy:dry-run` in package.json -- a deploy
# without it fails at bundle time, which is the correct failure. The
# alternative, a committed placeholder prompt, would deploy an Evan who
# confidently knows nothing about Evan.
main = "./worker/index.js"

# Pinned deliberately. Cloudflare gates runtime behaviour changes behind this
# date, so a deploy a year from now behaves like a deploy today. Bumping it is
# a decision, not a chore.
compatibility_date = "2026-09-11"

# Free, and the only way to see a 500 that happens to someone else. Costs
# nothing until there is a Worker script to produce logs.
[observability]
enabled = true

[assets]
# dist/, not public/. public/ is a build INPUT that is itself generated
# (`npm run textures` writes most of it) and largely gitignored, so it is never
# the complete thing. dist/ is what vite assembles and the only directory that
# is true at any single moment.
#
# Uploaded via `npm run build:deploy`, which is not the same as `npm run build`
# -- see deploy/.assetsignore for the reason that distinction is load-bearing.
directory = "./dist"

# The Worker's handle on the asset server, so `export default { fetch }` can
# fall through to the site for everything that is not /api/agent. Without this
# binding, setting `main` above would mean every non-asset request 404s from
# the Worker instead of reaching the asset server's own handling.
binding = "ASSETS"

# Every /api/ path must reach the Worker rather than the asset server, which
# would answer it with a 404 before any code runs: the chat endpoint
# (/api/agent) and the accounts and saved-world routes
# (worker/account/routes.js). Everything else still skips the Worker
# entirely, which is why serving the site costs nothing.
run_worker_first = ["/api/*"]

# not_found_handling is left at its default ("none": a real 404) rather than
# "single-page-application". SPA handling would answer /textures/atlas9.png
# with index.html and a 200, so a texture the build forgot to emit would render
# as a broken image instead of a 404 in the network tab. This site has exactly
# one HTML page and no client-side routes, so it gains nothing from SPA
# handling and loses the only signal that says an asset is missing.

# --------------------------------------------------------------------------
# The rate limit on AI Evan.
#
# Keyed on a session id minted in the browser at world boot, NOT on IP --
# Cloudflare's own docs recommend against IP for this, and an office behind one
# NAT is exactly the group of visitors most likely to arrive together.
#
# `unsafe.bindings` is how the rate-limiting binding is declared today; the
# name is Cloudflare's and means "not yet stable", not "dangerous". It is
# approximate and PER-COLO, which is documented as fine at this traffic and is
# the first thing to move into a Durable Object if a suspiciously even spread
# across regions ever shows up.
#
# namespace_id is a local label, not an account resource. Changing it resets
# the counters.
[[unsafe.bindings]]
name = "AGENT_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

# --------------------------------------------------------------------------
# Accounts and saved worlds: one Durable Object per signed-in visitor.
#
# worker/world/visitor.js, logic in worker/world/store.js. Holds that
# visitor's passkeys, nickname and saved world. Guests never create one; their
# world lives in IndexedDB. docs/decisions.md has the cost math against D1
# and R2. Multiplayer is cancelled (docs/SPRINT-1.md), so there is no room
# object any more and this is the only Durable Object.
#
# Secrets, set with `npx wrangler@4 secret put <NAME>`:
#   SESSION_SECRET   32+ random characters. Signs every session token. With it
#                    unset the site still works: everyone is a local guest and
#                    the sign-in button is hidden.
# Optional vars, once the domain is final (passkeys are bound to it):
#   PASSKEY_RP_ID    e.g. world.evanjolley.com   (defaults to the request host)
#   PASSKEY_ORIGIN   e.g. https://world.evanjolley.com
#   LOGIN            "off" hides sign-in while the domain is still moving
[[durable_objects.bindings]]
name = "VISITOR"
class_name = "Visitor"

# new_sqlite_classes, NOT new_classes. The storage backend is fixed at class
# creation and cannot be changed afterwards. Getting this wrong is a
# migration, not an edit.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Visitor"]
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# The custom domain, deliberately NOT configured.
#
# A Workers custom domain requires the zone to be on Cloudflare, and
# evanjolley.com is on GoDaddy's nameservers today (ns69/ns70.domaincontrol.com)
# pointing at GitHub Pages. Cloudflare only sells subdomain-only zones on
# Enterprise, so world.evanjolley.com cannot be attached without moving the
# whole zone -- which is a decision about evanjolley.com, not about this repo,
# and therefore Evan's. docs/DEPLOYMENT.md lays out both paths.
#
# Until then the Worker is live and shareable on its workers.dev URL, which
# needs no DNS at all. Once the zone moves, uncomment:
#
#   [[routes]]
#   pattern = "world.evanjolley.com"
#   custom_domain = true
#
# and `wrangler deploy` creates the DNS record itself.
# --------------------------------------------------------------------------
