<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>world.evanjolley.com</title>
  <style>
    /* Monocraft, a Minecraft-inspired typeface by Idrees Hassan, SIL OFL 1.1.
       Mojang's own font is not redistributable. License in public/fonts/. */
    @font-face {
      font-family: 'Monocraft';
      src: url('/fonts/Monocraft.ttf') format('truetype');
      font-display: swap;
    }

    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10;
      font-family: 'Monocraft', ui-monospace, SFMono-Regular, Menlo, monospace; color: #e8e6e3;
      -webkit-user-select: none; user-select: none; }

    #game { position: absolute; inset: 0; }
    img, .icon-face { image-rendering: pixelated; }
    .hidden { display: none !important; }

    /* ---------------- crosshair ----------------
       Minecraft's crosshair inverts what's behind it rather than being white,
       which is why it stays readable against both sky and dirt. */
    #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px;
      margin: -9px 0 0 -9px; pointer-events: none; mix-blend-mode: difference; z-index: 5; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
    #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }

    /* ---------------- block icons ---------------- */
    .block-icon { position: relative; width: var(--icon-size, 32px); height: var(--icon-size, 32px);
      transform-style: preserve-3d; transform: rotateX(-30deg) rotateY(-45deg);
      --face: calc(var(--icon-size, 32px) * 0.58); pointer-events: none; }
    .icon-face { position: absolute; width: var(--face); height: var(--face);
      left: calc(50% - var(--face) / 2); top: calc(50% - var(--face) / 2);
      background-size: 100% 100%; }
    .icon-top { transform: rotateX(90deg) translateZ(calc(var(--face) / 2)); }
    .icon-front { transform: translateZ(calc(var(--face) / 2)); }
    .icon-side { transform: rotateY(90deg) translateZ(calc(var(--face) / 2)); }
    /* The stack-size badge, drawn over an icon in a slot. Three containers use
       it -- the hotbar, the container panels and the carried stack -- which is
       why it lives up here with the icons rather than in any one of them.

       This was TWO `.count` rules for a while, one here and one down in the
       hotbar section. Same specificity, so the later one won every property it
       named and the only thing the first still contributed was font-weight.
       That reads as dead code and is not, which is the worst way for a rule to
       look. What survives below is the computed result of both, verified
       property by property against the old cascade rather than reasoned about:
       right -2px, bottom -4px, 18px, weight 700, z-index 3.

       The offsets are NEGATIVE on purpose -- the number hangs off the bottom
       right corner of the slot, past its edge, which is where Minecraft draws
       it. z-index puts it over the selection frame. */
    .count { position: absolute; right: -2px; bottom: -4px; font-size: 18px; font-weight: 700;
      color: #fff; text-shadow: 2px 2px 0 #3f3f3f; pointer-events: none; z-index: 3; }
    /* Non-block items are FLAT sprites, not cubes. They fill the slot rather
       than being inset like the cube: the 16x16 art already has its own
       padding, so shrinking it again leaves it swimming. */
    .item-icon { background-repeat: no-repeat; background-size: 100% 100%;
      image-rendering: pixelated; pointer-events: none; }

    /* ---------------- HUD ----------------
       Every size and offset is set from JS in Minecraft GUI pixels times a
       scale factor, so this only carries positioning and the pixel-art
       rendering mode. */
    .sprite { background-repeat: no-repeat; background-size: 100% 100%;
      image-rendering: pixelated; position: absolute; inset: 0; }
    #hud { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      pointer-events: none; z-index: 4; }
    /* Out of the flex flow on purpose. Minecraft draws this name at a FIXED
       height above the bottom of the screen and does not move it when the
       armor row appears or the hearts go away -- a flow item in this column
       cannot express that, and as one it sat directly on top of the hearts
       whenever the row above it collapsed. Nudging a margin would have hidden
       that rather than fixed it. hud.js sets the offset, the line box and the
       type size, all in GUI pixels. */
    #held-name { position: absolute; left: 50%; transform: translateX(-50%);
      white-space: nowrap; text-shadow: 2px 2px 0 #000; opacity: 0;
      transition: opacity 400ms; }
    #held-name.visible { opacity: 1; }
    /* Minecraft stacks these bottom-up: hotbar, XP bar, then hearts and food.
       The gaps BETWEEN them are Minecraft's own and are set from hud.js in GUI
       pixels with the rest of the geometry, not eyeballed in CSS here. The one
       above the XP row is the wider of them, which is what leaves room for the
       level number Minecraft draws sitting on top of the bar. */
    #status { display: flex; justify-content: space-between; width: 100%;
      position: relative; }
    #hearts, #hunger, #armor { position: relative; }
    /* Minecraft stacks the armor row directly above the hearts, left-aligned,
       and removes it entirely at zero points -- hud.js does the removing. */
    #armor-row { display: flex; width: 100%; }
    .icon-slot { position: absolute; top: 0; }
    .icon-slot .fill { z-index: 1; }
    #xp-row { position: relative; display: flex; align-items: center;
      justify-content: center; }
    #xp-bar { position: relative; background-repeat: no-repeat; background-size: 100% 100%;
      image-rendering: pixelated; }
    #xp-fill { position: absolute; left: 0; top: 0; background-repeat: no-repeat;
      background-position: left top; image-rendering: pixelated; }
    #xp-level { position: absolute; font-size: 18px; color: #80ff20;
      text-shadow: 2px 2px 0 #000; bottom: calc(100% - 3px); }
    #hotbar { position: relative; background-repeat: no-repeat; background-size: 100% 100%;
      image-rendering: pixelated; }
    .hotbar-slot { position: absolute; display: grid; place-items: center; }
    #hotbar-selection { position: absolute; z-index: 2; pointer-events: none; }
    #coords { position: absolute; left: 10px; top: 10px; font-size: 12px; opacity: 0.55;
      text-shadow: 1px 1px 0 #000; pointer-events: none; z-index: 4; }

    /* ---------------- inventory ---------------- */
    /* Two container screens share every rule: the inventory (2x2 crafting,
       armor, offhand) and the crafting table (3x3). Only the background
       sprite and the slot positions differ, both set from inventory.js. */
    #inventory, #crafting { position: absolute; inset: 0; display: grid; place-content: center;
      background: rgba(0,0,0,0.55); z-index: 20; }
    /* The sprite leaves the player-preview window transparent, which showed
       the page's black through it. Minecraft's panel grey sits behind so it
       reads as a recess. The 3D character render belongs here later. */
    #inv-panel, #craft-panel { position: relative; background-repeat: no-repeat;
      background-size: 100% 100%; background-color: #c6c6c6; image-rendering: pixelated; }
    #inv-doll { position: absolute; }
    .doll-part { position: absolute; background-repeat: no-repeat;
      image-rendering: pixelated; }
    /* Every cell on a container panel. `.slot` is the narrower class for the
       player's own 36 -- see the comment in inventory.js. */
    .gui-slot { position: absolute; display: grid; place-items: center; cursor: pointer;
      background-repeat: no-repeat; background-size: 100% 100%; image-rendering: pixelated; }
    /* Container titles. Minecraft draws them with no shadow, unlike the HUD. */
    .gui-label { position: absolute; line-height: 1; pointer-events: none; }
    /* background-COLOR, not the `background` shorthand: the shorthand resets
       background-size and background-repeat to their initial values, which
       made the hint outline in an empty armor or offhand slot tile 2x2 the
       moment the pointer touched it. */
    .gui-slot:hover { background-color: rgba(255,255,255,0.35); }
    #inv-carried { position: fixed; left: 0; top: 0; display: grid; place-items: center;
      pointer-events: none; z-index: 30; }
    body.inv-open #hud, body.inv-open #crosshair,
    body.menu-open #hud, body.menu-open #crosshair { display: none; }

    /* ---------------- Minecraft buttons ----------------
       Nine-sliced from Minecraft's own widget sprite. Its .mcmeta declares
       border: 3, so the corners hold at 3px and only the middle stretches --
       which is how the button keeps crisp edges at any width. */
    .mc-button {
      display: block; width: 100%; box-sizing: border-box;
      font: inherit; font-size: 15px; line-height: 1;
      min-height: 40px; padding: 12px 10px; text-align: center; text-decoration: none;
      cursor: pointer; color: #e0e0e0; text-shadow: 2px 2px 0 #3f3f3f;
      background: none; image-rendering: pixelated;
      border-style: solid; border-width: 6px;
      border-image-source: url(/ui/button.png);
      border-image-slice: 3 fill;
      border-image-repeat: stretch;
    }
    .mc-button:hover { border-image-source: url(/ui/button_hover.png); color: #ffffa0; }
    .button-row { display: flex; gap: 8px; }
    .button-row .mc-button { flex: 1; }

    /* ---------------- pause menu ---------------- */
    #pause { position: absolute; inset: 0; z-index: 22;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: rgba(0,0,0,0.62); }
    #pause h1 { margin: 0 0 6px; font-size: 20px; font-weight: 400; color: #fff;
      text-shadow: 2px 2px 0 #3f3f3f; }
    #pause-buttons { display: flex; flex-direction: column; gap: 8px; width: 400px; }

    /* ---------------- controls ---------------- */
    #controls { position: absolute; inset: 0; z-index: 24;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: rgba(0,0,0,0.82); }
    #controls h1 { margin: 0; font-size: 20px; font-weight: 400; color: #fff;
      text-shadow: 2px 2px 0 #3f3f3f; }
    #controls-list { display: grid; grid-template-columns: auto 1fr;
      gap: 8px 22px; margin: 0; font-size: 13px; max-width: 560px; }
    #controls-list dt { color: #ffffa0;
      text-shadow: 2px 2px 0 #3f3f3f; white-space: nowrap; }
    #controls-list dd { margin: 0; color: #d8d8d8;
      text-shadow: 2px 2px 0 #3f3f3f; }
    #controls-close { width: 200px; }

    /* ---------------- chat ----------------
       Sizes and offsets come from chat.js in Minecraft GUI pixels, like the
       rest of the HUD. What lives here is only positioning and the two
       background alphas, which are Minecraft's own: the log's rows are
       0x7F000000 (alpha 127) and the input bar is 0x80000000 (alpha 128).
       They differ by one because they come from different code paths, and
       matching them would be the wrong kind of tidy. */
    #chat { position: absolute; left: 0; z-index: 6; pointer-events: none;
      display: flex; flex-direction: column; justify-content: flex-end;
      overflow: hidden; }
    /* Wrapped lines are not indented in Minecraft, and each row's background
       is the full chat width rather than hugging the text. pre-wrap plus a
       fixed width gets both for free. */
    .chat-line { background: rgba(0, 0, 0, 0.498); white-space: pre-wrap;
      overflow-wrap: break-word; }
    #chat-bar { position: absolute; z-index: 7; background: rgba(0, 0, 0, 0.502); }
    #chat-input { display: block; width: 100%; height: 100%; box-sizing: border-box;
      background: none; border: 0; outline: 0; padding: 0; font: inherit;
      color: #e0e0e0; text-shadow: 2px 2px 0 #383838;
      /* Minecraft draws its own cursor, so the browser's is hidden and
         #chat-caret is drawn in its place. */
      caret-color: transparent; }
    #chat-caret { position: absolute; top: 0; color: #e0e0e0;
      text-shadow: 2px 2px 0 #383838; pointer-events: none; white-space: pre; }
    /* Mid-string the cursor becomes a thin bar instead of an underscore. */
    #chat-caret.bar { color: transparent; text-shadow: none; background: #d0d0d0;
      width: var(--caret-w); height: var(--caret-h); top: var(--caret-top); }
    body.inv-open #chat, body.menu-open #chat,
    body.inv-open #chat-bar, body.menu-open #chat-bar { display: none; }

    /* ---------------- death ---------------- */
    #death { position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
      gap: 14px; background: rgba(120, 0, 0, 0.45); z-index: 25; }
    #death h1 { margin: 0; font-size: 30px; text-shadow: 3px 3px 0 #000; }
    #death .mc-button { width: 260px; }

    /* ---------------- loading ----------------
       The page's INITIAL state, not something JavaScript adds. main.js gates
       boot on a 981KB terrain fetch with a top-level await, so between
       first paint and the first rendered frame there is a real gap with
       nothing in it. Markup that is already there covers the gap even if the
       module never evaluates; a card that JS has to insert cannot cover the
       case where JS is what is slow. main.js removes it on first render. */
    #loading { position: absolute; inset: 0; display: grid; place-content: center;
      justify-items: center; gap: 18px; background: #77a8ff; z-index: 40; }
    #loading .title { font-size: 22px; text-shadow: 3px 3px 0 #383838; }
    #loading .sub { font-size: 14px; color: #dfe9ff; text-shadow: 2px 2px 0 #383838; }
    #loading .bar { width: 260px; height: 10px; border: 2px solid #383838;
      background: #2b2b2b; overflow: hidden; }
    /* Indeterminate on purpose: fetch() gives no progress without streaming
       the body by hand, and a fake percentage is worse than none. */
    #loading .bar i { display: block; width: 40%; height: 100%; background: #91bd59;
      animation: loadslide 1.1s linear infinite; }
    @keyframes loadslide { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
  </style>
</head>
<body>
  <div id="game" tabindex="0"></div>

  <div id="loading">
    <div class="title">Building terrain</div>
    <div class="bar"><i></i></div>
    <div class="sub">128 x 128 of Minecraft 1.21.8, seed 12345</div>
  </div>

  <div id="crosshair"></div>
  <div id="coords"></div>

  <div id="hud">
    <div id="held-name"></div>
    <div id="armor-row" class="hidden"><div id="armor"></div></div>
    <div id="status">
      <div id="hearts"></div>
      <div id="hunger"></div>
    </div>
    <div id="xp-row">
      <div id="xp-bar"><div id="xp-fill"></div></div>
      <div id="xp-level"></div>
    </div>
    <div id="hotbar"></div>
  </div>

  <div id="chat"><div id="chat-lines"></div></div>
  <div id="chat-bar" class="hidden">
    <input id="chat-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" />
    <span id="chat-caret"></span>
  </div>

  <div id="inventory" class="hidden">
    <div id="inv-panel"></div>
  </div>
  <div id="crafting" class="hidden">
    <div id="craft-panel"></div>
  </div>
  <div id="inv-carried" class="hidden"></div>

  <div id="pause" class="hidden">
    <h1>Game Menu</h1>
    <div id="pause-buttons"></div>
  </div>

  <div id="controls" class="hidden">
    <h1>Controls</h1>
    <dl id="controls-list"></dl>
    <button id="controls-close" class="mc-button">Done</button>
  </div>

  <div id="death" class="hidden">
    <h1>You Died!</h1>
    <button id="respawn-btn" class="mc-button">Respawn</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
