<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>world.evanjolley.com</title>
  <style>
    /* Monocraft, a Minecraft-inspired typeface by Idrees Hassan, SIL OFL 1.1.
       Mojang's own font is not redistributable. License in public/fonts/.

       SUBSET, and the name is still "Monocraft" on purpose: Monocraft declares
       no Reserved Font Name, so OFL lets the derivative keep it -- which is
       why nothing below and no canvas font spec in src/ had to be renamed.
       177 codepoints instead of 1,475, WOFF2 instead of TTF, 2.6 KB instead of
       210 KB. It was 21% of the boot payload and is now 0.3%. fonts-src/
       holds the untouched original and the command that re-cuts this one.

       The fallback stack below is load-bearing now rather than decorative:
       AI Evan's chat comes out of an LLM and can emit anything, and anything
       outside the subset lands on ui-monospace. Common typographic
       punctuation is included precisely so that stays rare. */
    @font-face {
      font-family: 'Monocraft';
      src: url('/fonts/Monocraft.woff2') format('woff2');
      font-display: swap;
    }

    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10;
      font-family: 'Monocraft', ui-monospace, SFMono-Regular, Menlo, monospace; color: #e8e6e3;
      -webkit-user-select: none; user-select: none; }

    #game { position: absolute; inset: 0; }
    img, .icon-face { image-rendering: pixelated; }
    .hidden { display: none !important; }

    /* ---------------- crosshair ----------------
       Minecraft's crosshair inverts what's behind it rather than being white,
       which is why it stays readable against both sky and dirt. */
    #crosshair { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px;
      margin: -9px 0 0 -9px; pointer-events: none; mix-blend-mode: difference; z-index: 5; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
    #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }

    /* ---------------- block icons ---------------- */
    /* `--face` is ONE WHOLE BLOCK, not one face. A slab's faces are half of
       it, and blockIcon.js sizes and places every face from the same box list
       that builds the real mesh -- so the size, position, transform and
       texture crop are all inline and none of them belong here. What is left
       is the camera (fixed, above-left, Minecraft's own angle) and the 3D
       context the faces need to sort against each other. */
    .block-icon { position: relative; width: var(--icon-size, 32px); height: var(--icon-size, 32px);
      transform-style: preserve-3d; transform: rotateX(-30deg) rotateY(-45deg);
      --face: calc(var(--icon-size, 32px) * 0.58); pointer-events: none; }
    .icon-face { position: absolute; background-repeat: no-repeat; }
    /* The stack-size badge, drawn over an icon in a slot. Three containers use
       it -- the hotbar, the container panels and the carried stack -- which is
       why it lives up here with the icons rather than in any one of them.

       This was TWO `.count` rules for a while, one here and one down in the
       hotbar section. Same specificity, so the later one won every property it
       named and the only thing the first still contributed was font-weight.
       That reads as dead code and is not, which is the worst way for a rule to
       look. What survives below is the computed result of both, verified
       property by property against the old cascade rather than reasoned about:
       right -2px, bottom -4px, 18px, weight 700, z-index 3.

       The offsets are NEGATIVE on purpose -- the number hangs off the bottom
       right corner of the slot, past its edge, which is where Minecraft draws
       it. z-index puts it over the selection frame. */
    .count { position: absolute; right: -2px; bottom: -4px; font-size: 18px; font-weight: 700;
      color: #fff; text-shadow: 2px 2px 0 #3f3f3f; pointer-events: none; z-index: 3; }
    /* Non-block items are FLAT sprites, not cubes. They fill the slot rather
       than being inset like the cube: the 16x16 art already has its own
       padding, so shrinking it again leaves it swimming. */
    .item-icon { background-repeat: no-repeat; background-size: 100% 100%;
      image-rendering: pixelated; pointer-events: none; }

    /* ---------------- HUD ----------------
       Every size and offset is set from JS in Minecraft GUI pixels times a
       scale factor, so this only carries positioning and the pixel-art
       rendering mode. */
    .sprite { background-repeat: no-repeat; background-size: 100% 100%;
      image-rendering: pixelated; position: absolute; inset: 0; }
    #hud { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      pointer-events: none; z-index: 4; }
    /* Out of the flex flow on purpose. Minecraft draws this name at a FIXED
       height above the bottom of the screen and does not move it when the
       armor row appears or the hearts go away -- a flow item in this column
       cannot express that, and as one it sat directly on top of the hearts
       whenever the row above it collapsed. Nudging a margin would have hidden
       that rather than fixed it. hud.js sets the offset, the line box and the
       type size, all in GUI pixels. */
    #held-name { position: absolute; left: 50%; transform: translateX(-50%);
      white-space: nowrap; text-shadow: 2px 2px 0 #000; opacity: 0;
      transition: opacity 400ms; }
    #held-name.visible { opacity: 1; }
    /* Minecraft stacks these bottom-up: hotbar, XP bar, then hearts and food.
       The gaps BETWEEN them are Minecraft's own and are set from hud.js in GUI
       pixels with the rest of the geometry, not eyeballed in CSS here. The one
       above the XP row is the wider of them, which is what leaves room for the
       level number Minecraft draws sitting on top of the bar. */
    #status { display: flex; justify-content: space-between; width: 100%;
      position: relative; }
    #hearts, #hunger, #armor { position: relative; }
    /* Minecraft stacks the armor row directly above the hearts, left-aligned,
       and removes it entirely at zero points -- hud.js does the removing. */
    #armor-row { display: flex; width: 100%; }
    .icon-slot { position: absolute; top: 0; }
    /* Three layers in one 9x9 cell, bottom to top: the container, the pale
       "you just lost this" heart, the live heart. hud.js sets `top` on the
       slot during the low-health jitter -- it writes 0 the rest of the time,
       so the resting row is still exactly this rule's `top: 0`. */
    .icon-slot .blink { z-index: 1; }
    .icon-slot .fill { z-index: 2; }
    #xp-row { position: relative; display: flex; align-items: center;
      justify-content: center; }
    #xp-bar { position: relative; background-repeat: no-repeat; background-size: 100% 100%;
      image-rendering: pixelated; }
    #xp-fill { position: absolute; left: 0; top: 0; background-repeat: no-repeat;
      background-position: left top; image-rendering: pixelated; }
    #xp-level { position: absolute; font-size: 18px; color: #80ff20;
      text-shadow: 2px 2px 0 #000; bottom: calc(100% - 3px); }
    #hotbar { position: relative; background-repeat: no-repeat; background-size: 100% 100%;
      image-rendering: pixelated; }
    .hotbar-slot { position: absolute; display: grid; place-items: center; }
    #hotbar-selection { position: absolute; z-index: 2; pointer-events: none; }
    #coords { position: absolute; left: 10px; top: 10px; font-size: 12px; opacity: 0.55;
      text-shadow: 1px 1px 0 #000; pointer-events: none; z-index: 4; }

    /* ---------------- F3 debug screen ----------------
       Sizes and offsets come from debugScreen.js in Minecraft GUI pixels, like
       the HUD and chat. Only the things that are the same for every line live
       here.

       z-index 10 puts it OVER chat (6/7) and under the inventory and pause menu
       (20+), which is vanilla's own stacking: the debug overlay is drawn last
       in the HUD pass, so it covers chat, and screens are drawn after the HUD,
       so they cover it. Note the absence of a `body.inv-open #debug` rule --
       every other layer here hides under a screen and this one deliberately
       does not, because in vanilla the F3 text stays visible behind an open
       inventory.

       No text-shadow, unlike every other text layer in this file. Vanilla draws
       the debug screen with shadow off and leans on the per-line background
       instead, which is why it stays legible against a bright sky. */
    #debug { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
    #debug.hidden { display: none; }
    /* overflow:hidden establishes a block formatting context so the floated
       lines inside are contained; without it both columns collapse to zero
       height and the first line paints over the second. */
    #debug-left, #debug-right { position: absolute; overflow: hidden; }
    /* The right column is right-aligned as a block, so each line's background
       hugs its own text from the right edge inward -- which is what vanilla
       does, and what a fixed-width column would not. */
    #debug-right { text-align: right; }
    /* float + clear is what makes each line its own row while still shrinking to
       fit its text. A plain block would stretch the background bar to the full
       column width; a plain inline-block would put every line on one row.
       `pre` keeps the blank separator lines from collapsing to zero height --
       they have no content, and a collapsed row would swallow the gap. */
    .debug-line { color: #e0e0e0; white-space: pre; float: left; clear: both; }
    #debug-right .debug-line { float: right; }

    /* ---------------- inventory ---------------- */
    /* Two container screens share every rule: the inventory (2x2 crafting,
       armor, offhand) and the crafting table (3x3). Only the background
       sprite and the slot positions differ, both set from inventory.js. */
    #inventory, #crafting, #creative, #furnace { position: absolute; inset: 0; display: grid; place-content: center;
      background: rgba(0,0,0,0.55); z-index: 20; }
    /* The sprite leaves the player-preview window transparent, which showed
       the page's black through it. Minecraft's panel grey sits behind so it
       reads as a recess. The 3D character render belongs here later. */
    #inv-panel, #craft-panel { position: relative; background-repeat: no-repeat;
      background-size: 100% 100%; background-color: #c6c6c6; image-rendering: pixelated; }
    #inv-doll { position: absolute; }
    .doll-part { position: absolute; background-repeat: no-repeat;
      image-rendering: pixelated; }
    /* Every cell on a container panel. `.slot` is the narrower class for the
       player's own 36 -- see the comment in inventory.js. */
    .gui-slot { position: absolute; display: grid; place-items: center; cursor: pointer;
      background-repeat: no-repeat; background-size: 100% 100%; image-rendering: pixelated; }
    /* Container titles. Minecraft draws them with no shadow, unlike the HUD. */
    .gui-label { position: absolute; line-height: 1; pointer-events: none; }
    /* background-COLOR, not the `background` shorthand: the shorthand resets
       background-size and background-repeat to their initial values, which
       made the hint outline in an empty armor or offhand slot tile 2x2 the
       moment the pointer touched it. */
    .gui-slot:hover { background-color: rgba(255,255,255,0.35); }
    /* ---------------- creative picker ----------------
       DRAWN rather than blitted, and inventory.js says why at length: the
       creative_inventory art exists in the vanilla jar and does not exist in
       the CE pack, which is the pack a deploy ships. Every colour below is
       Minecraft's own -- panel #c6c6c6, highlight #ffffff, shadow #555555,
       slot recess #8b8b8b between #373737 and #ffffff.

       The bevels are box-shadows at 2px, which is one GUI pixel at SCALE 2.
       They are hardcoded rather than derived because CSS cannot multiply, and
       the alternative (setting them from JS with px()) would put four more
       style writes in the hot repaint path to express a constant. */
    #creative-panel { position: relative; background: #c6c6c6; image-rendering: pixelated;
      box-shadow: inset 4px 4px 0 #ffffff, inset -4px -4px 0 #555555,
                  0 0 0 2px #000000; }
    /* A slot with no sprite behind it, so it has to draw its own recess.
       The two shadows are the top-left dark edge and the bottom-right light
       one; together they read as a 1px-inset hole, which is what the sprite
       sheet paints. */
    .drawn-slot { background-color: #8b8b8b;
      box-shadow: -2px -2px 0 0 #373737, 2px 2px 0 0 #ffffff; }
    /* The destroy slot is a slot-shaped bin. Vanilla draws a lava-and-skull
       icon on it; there is no such sprite in either source, so it is marked
       with a red recess instead -- unmistakably "things go here to die". */
    .creative-destroy { background-color: #8b3b3b; }
    .creative-destroy:hover { background-color: #c05050; }

    .creative-track { position: absolute; background: #000000; }
    .creative-thumb { background: #c6c6c6;
      box-shadow: inset 2px 2px 0 #ffffff, inset -2px -2px 0 #555555; }
    /* Vanilla ships a whole second sprite (scroller_disabled.png) for a tab
       that fits on one page, so the greyed-out state is vanilla, not a
       shortcut. */
    .creative-thumb.disabled { background: #6b6b6b; box-shadow: none; }

    /* Tabs. 26x32 at a 28 pitch, overlapping the panel by 4 GUI px -- the top
       row hangs above it, the bottom row below. The SELECTED tab loses its
       shadow on the panel-facing edge so its body merges into the panel with
       no seam, which is exactly what vanilla's selected sprite does; the
       unselected ones keep the seam and sit a shade darker. */
    #creative-panel .gui-tab { position: absolute; display: grid; place-items: center;
      cursor: pointer; background: #c6c6c6; filter: brightness(0.78); }
    #creative-panel .gui-tab-top { box-shadow: inset 4px 4px 0 #ffffff, inset -4px 0 0 #555555,
      0 0 0 2px #000000; border-radius: 6px 6px 0 0; }
    #creative-panel .gui-tab-bottom { box-shadow: inset 4px 0 0 #ffffff, inset -4px -4px 0 #555555,
      0 0 0 2px #000000; border-radius: 0 0 6px 6px; }
    #creative-panel .gui-tab.selected { filter: none; z-index: 2; }
    .gui-tab-icon { pointer-events: none; }

    /* ---------------- furnace ----------------
       DRAWN rather than blitted, same call and the same reason as the
       creative picker above: gui/container/furnace.png is in the vanilla jar
       and the CE pack has no furnace GUI at all, and CE is what a deploy
       ships. Same palette, same 2px-per-GUI-pixel bevels. */
    #furnace-panel { position: relative; background: #c6c6c6; image-rendering: pixelated;
      box-shadow: inset 4px 4px 0 #ffffff, inset -4px -4px 0 #555555,
                  0 0 0 2px #000000; }
    /* The title is centred, which is AbstractFurnaceScreen's own
       titleLabelX = (imageWidth - font.width(title)) / 2 -- so it is a full
       width line with centred text rather than a left offset we would have to
       measure the font to compute. */
    .furnace-title { left: 0; right: 0; text-align: center; }

    /* The flame and the arrow. Each is a SHAPE (clip-path) holding two
       layers: the dark one vanilla's background sprite paints, and a lit
       layer over it. The lit layer is anchored -- flame to the bottom, arrow
       to the left -- so growing it reveals the shape the way vanilla's
       partial blit does, rather than scaling a whole sprite down. */
    .furnace-gauge { position: absolute; background: #545454; }
    .gauge-fill { position: absolute; }
    /* 14x14. A flame: wide base, pinched waist, tip off to one side, which is
       roughly what the vanilla sprite silhouettes to. */
    .furnace-flame { clip-path: polygon(50% 0%, 72% 30%, 64% 43%, 86% 36%,
      100% 64%, 86% 93%, 50% 100%, 14% 93%, 0% 64%, 7% 36%, 29% 43%); }
    .furnace-flame .gauge-fill { left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, #ff7b00 0%, #ffc400 55%, #fff0a0 100%); }
    /* 24x16. The shaft is 6 px tall (5..11) and the head starts at x=14,
       which is what the vanilla arrow measures. */
    .furnace-arrow { clip-path: polygon(0% 31.25%, 58.3% 31.25%, 58.3% 0%,
      100% 50%, 58.3% 100%, 58.3% 68.75%, 0% 68.75%); }
    .furnace-arrow .gauge-fill { left: 0; top: 0; bottom: 0; background: #ffffff; }

    #creative-search { position: absolute; background: #000000; color: #e0e0e0;
      border: 2px solid #a0a0a0; outline: none; font-family: inherit;
      padding: 0 4px; box-sizing: border-box; }

    #inv-carried { position: fixed; left: 0; top: 0; display: grid; place-items: center;
      pointer-events: none; z-index: 30; }

    /* ---------------- item tooltip ----------------
       Vanilla's, and inventory.js records where each number came from. The
       two layers are how vanilla draws it: a background rect, and a 1px frame
       inset 1px inside it, so a ring of background shows outside the frame.

       `border-image` with a slice of 1 is what paints a GRADIENT frame -- the
       gradient's top row becomes the top border, its bottom row the bottom
       border, and the strip between them stretches down the sides, which is
       exactly the four fills vanilla does. Road not taken: four absolutely
       positioned 2px divs, which is the same picture and four more elements.

       2px is one GUI pixel at SCALE 2, the same hardcoding (and the same
       reason -- CSS cannot multiply) as the bevels above. Sits above the
       carried stack at z-index 30, because a tooltip is the topmost thing on
       a container screen in vanilla too. */
    #gui-tooltip { position: fixed; left: 0; top: 0; z-index: 31; pointer-events: none;
      padding: 2px; background: rgba(16, 0, 16, 0.941); white-space: nowrap; }
    #gui-tooltip .tip-inner { padding: 4px; border: 2px solid transparent;
      border-image: linear-gradient(to bottom,
        rgba(80, 0, 255, 0.314), rgba(40, 0, 127, 0.314)) 1; }
    /* 8 GUI px of text on a 10 GUI px pitch, which is vanilla's line spacing,
       expressed as a 4px gap so a one-line tooltip stays 8 px tall. */
    #gui-tooltip .tip-line { height: 16px; line-height: 16px; color: #fff;
      text-shadow: 2px 2px 0 #3f3f3f; }
    #gui-tooltip .tip-line + .tip-line { margin-top: 4px; }
    /* Vanilla's ChatFormatting.DARK_GRAY, 0x555555, with the shadow it always
       draws under text: the colour scaled by a quarter, 0x151515. */
    #gui-tooltip .tip-dim { color: #555555; text-shadow: 2px 2px 0 #151515; }
    body.inv-open #hud, body.inv-open #crosshair,
    body.menu-open #hud, body.menu-open #crosshair { display: none; }

    /* ---------------- Minecraft buttons ----------------
       Nine-sliced from Minecraft's own widget sprite. Its .mcmeta declares
       border: 3, so the corners hold at 3px and only the middle stretches --
       which is how the button keeps crisp edges at any width. */
    .mc-button {
      display: block; width: 100%; box-sizing: border-box;
      font: inherit; font-size: 15px; line-height: 1;
      min-height: 40px; padding: 12px 10px; text-align: center; text-decoration: none;
      cursor: pointer; color: #e0e0e0; text-shadow: 2px 2px 0 #3f3f3f;
      background: none; image-rendering: pixelated;
      border-style: solid; border-width: 6px;
      border-image-source: url(/ui/button.png);
      border-image-slice: 3 fill;
      border-image-repeat: stretch;
    }
    .mc-button:hover { border-image-source: url(/ui/button_hover.png); color: #ffffa0; }
    .button-row { display: flex; gap: 8px; }
    .button-row .mc-button { flex: 1; }

    /* ---------------- pause menu ---------------- */
    #pause { position: absolute; inset: 0; z-index: 22;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: rgba(0,0,0,0.62); }
    #pause h1 { margin: 0 0 6px; font-size: 20px; font-weight: 400; color: #fff;
      text-shadow: 2px 2px 0 #3f3f3f; }
    #pause-buttons { display: flex; flex-direction: column; gap: 8px; width: 400px; }

    /* ---------------- controls ---------------- */
    #controls { position: absolute; inset: 0; z-index: 24;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: rgba(0,0,0,0.82); }
    #controls h1 { margin: 0; font-size: 20px; font-weight: 400; color: #fff;
      text-shadow: 2px 2px 0 #3f3f3f; }
    #controls-list { display: grid; grid-template-columns: auto 1fr;
      gap: 8px 22px; margin: 0; font-size: 13px; max-width: 560px; }
    #controls-list dt { color: #ffffa0;
      text-shadow: 2px 2px 0 #3f3f3f; white-space: nowrap; }
    #controls-list dd { margin: 0; color: #d8d8d8;
      text-shadow: 2px 2px 0 #3f3f3f; }
    #controls-close { width: 200px; }

    /* ---------------- chat ----------------
       Sizes and offsets come from chat.js in Minecraft GUI pixels, like the
       rest of the HUD. What lives here is only positioning and the two
       background alphas, which are Minecraft's own: the log's rows are
       0x7F000000 (alpha 127) and the input bar is 0x80000000 (alpha 128).
       They differ by one because they come from different code paths, and
       matching them would be the wrong kind of tidy. */
    #chat { position: absolute; left: 0; z-index: 6; pointer-events: none;
      display: flex; flex-direction: column; justify-content: flex-end;
      overflow: hidden; }
    /* Wrapped lines are not indented in Minecraft, and each row's background
       is the full chat width rather than hugging the text. pre-wrap plus a
       fixed width gets both for free. */
    .chat-line { background: rgba(0, 0, 0, 0.498); white-space: pre-wrap;
      overflow-wrap: break-word; }
    #chat-bar { position: absolute; z-index: 7; background: rgba(0, 0, 0, 0.502); }
    #chat-input { display: block; width: 100%; height: 100%; box-sizing: border-box;
      background: none; border: 0; outline: 0; padding: 0; font: inherit;
      color: #e0e0e0; text-shadow: 2px 2px 0 #383838;
      /* Minecraft draws its own cursor, so the browser's is hidden and
         #chat-caret is drawn in its place. */
      caret-color: transparent; }
    #chat-caret { position: absolute; top: 0; color: #e0e0e0;
      text-shadow: 2px 2px 0 #383838; pointer-events: none; white-space: pre; }
    /* Mid-string the cursor becomes a thin bar instead of an underscore. */
    #chat-caret.bar { color: transparent; text-shadow: none; background: #d0d0d0;
      width: var(--caret-w); height: var(--caret-h); top: var(--caret-top); }
    body.inv-open #chat, body.menu-open #chat,
    body.inv-open #chat-bar, body.menu-open #chat-bar { display: none; }

    /* ---------------- tab player list ----------------
       OWNED BY src/tabList.js. Every size and offset is computed there, in
       Minecraft GUI pixels against hud.js's SCALE, because the panel's width
       is derived from the longest name and cannot be a constant. What lives
       here is only what is the same for every row.

       The two alphas are Minecraft's own and are NOT chat's or the debug
       screen's: PlayerTabOverlay fills the panel with Integer.MIN_VALUE
       (0x80000000 -- black, alpha 128) and each row with 553648127
       (0x20FFFFFF -- WHITE, alpha 32). The row plate lightening the panel
       rather than darkening it is what gives the list its banded look.

       z-index 11 puts it over chat (6/7) and over the F3 overlay (10), and
       under the screens (20+). That is vanilla's own order: the player list is
       the LAST thing Gui.render draws in the HUD pass, after both of them. */
    #tab-list { position: absolute; inset: 0; pointer-events: none; z-index: 11; }
    #tab-panel { position: absolute; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.502); }
    .tab-row { position: absolute; background: rgba(255, 255, 255, 0.125); }
    .tab-head, .tab-name, .tab-ping { position: absolute; top: 0; }
    .tab-head, .tab-ping { background-size: 100% 100%; image-rendering: pixelated; }
    /* white-space: pre so a name can never wrap out of its 8px-tall row. */
    .tab-name { color: #fff; text-shadow: 2px 2px 0 #3f3f3f; white-space: pre; }
    /* Vanilla hides the player list behind a screen, like chat and unlike F3. */
    body.inv-open #tab-list, body.menu-open #tab-list { display: none; }

    /* ---------------- death ---------------- */
    #death { position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
      gap: 14px; background: rgba(120, 0, 0, 0.45); z-index: 25; }
    #death h1 { margin: 0; font-size: 30px; text-shadow: 3px 3px 0 #000; }
    /* The death message, under "You Died!" exactly as vanilla's DeathScreen
       stacks it. White and small -- it is the same sentence chat just printed,
       not a second headline. respawn.js fills it in; it is empty in the
       markup rather than defaulted to "You died" so a missing wire shows up as
       a visible gap instead of a plausible wrong message. */
    #death .message { margin: 0; font-size: 14px; text-shadow: 2px 2px 0 #000; }
    #death .mc-button { width: 260px; }

    /* ---------------- loading ----------------
       The page's INITIAL state, not something JavaScript adds. main.js gates
       boot on a 981KB terrain fetch with a top-level await, so between
       first paint and the first rendered frame there is a real gap with
       nothing in it. Markup that is already there covers the gap even if the
       module never evaluates; a card that JS has to insert cannot cover the
       case where JS is what is slow. main.js removes it on first render. */
    #loading { position: absolute; inset: 0; display: grid; place-content: center;
      justify-items: center; gap: 18px; background: #77a8ff; z-index: 40; }
    #loading .title { font-size: 22px; text-shadow: 3px 3px 0 #383838; }
    #loading .sub { font-size: 14px; color: #dfe9ff; text-shadow: 2px 2px 0 #383838; }
    #loading .bar { width: 260px; height: 10px; border: 2px solid #383838;
      background: #2b2b2b; overflow: hidden; }
    /* Indeterminate on purpose: fetch() gives no progress without streaming
       the body by hand, and a fake percentage is worse than none. */
    #loading .bar i { display: block; width: 40%; height: 100%; background: #91bd59;
      animation: loadslide 1.1s linear infinite; }
    @keyframes loadslide { from { transform: translateX(-100%) } to { transform: translateX(250%) } }
  </style>
</head>
<body>
  <div id="game" tabindex="0"></div>

  <div id="loading">
    <div class="title">Building terrain</div>
    <div class="bar"><i></i></div>
    <div class="sub">128 x 128 of Minecraft 1.21.8, seed 12345</div>
  </div>

  <div id="crosshair"></div>
  <div id="coords"></div>

  <div id="hud">
    <div id="held-name"></div>
    <div id="armor-row" class="hidden"><div id="armor"></div></div>
    <div id="status">
      <div id="hearts"></div>
      <div id="hunger"></div>
    </div>
    <div id="xp-row">
      <div id="xp-bar"><div id="xp-fill"></div></div>
      <div id="xp-level"></div>
    </div>
    <div id="hotbar"></div>
  </div>

  <div id="chat"><div id="chat-lines"></div></div>
  <div id="chat-bar" class="hidden">
    <input id="chat-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" />
    <span id="chat-caret"></span>
  </div>

  <div id="inventory" class="hidden">
    <div id="inv-panel"></div>
  </div>
  <div id="crafting" class="hidden">
    <div id="craft-panel"></div>
  </div>
  <!-- The furnace. A third container screen, and the only one whose contents
       keep changing while you watch it. -->
  <div id="furnace" class="hidden">
    <div id="furnace-panel"></div>
  </div>
  <!-- The creative item picker. A fourth screen, not a mode of the first. -->
  <div id="creative" class="hidden">
    <div id="creative-panel"></div>
  </div>
  <div id="inv-carried" class="hidden"></div>

  <div id="pause" class="hidden">
    <h1>Game Menu</h1>
    <div id="pause-buttons"></div>
  </div>

  <div id="controls" class="hidden">
    <h1>Controls</h1>
    <dl id="controls-list"></dl>
    <button id="controls-close" class="mc-button">Done</button>
  </div>

  <div id="death" class="hidden">
    <h1>You Died!</h1>
    <p id="death-message" class="message"></p>
    <button id="respawn-btn" class="mc-button">Respawn</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
